<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>User Registration</h1>
            <p class="subtitle">Please fill in your details to create an account</p>
            
            <!-- Success/Error Message -->
            <div id="message-box" class="message-box"></div>
            
            <form id="registrationForm" novalidate>
                <!-- First Name -->
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName" required>
                    <span class="error-message" id="firstName-error"></span>
                </div>
                
                <!-- Last Name -->
                <div class="form-group">
                    <label for="lastName">Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="lastName" required>
                    <span class="error-message" id="lastName-error"></span>
                </div>
                
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="email-error"></span>
                </div>
                
                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="+1234567890" required>
                    <span class="error-message" id="phone-error"></span>
                </div>
                
                <!-- Age -->
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="1" max="120">
                    <span class="error-message" id="age-error"></span>
                </div>
                
                <!-- Gender -->
                <div class="form-group">
                    <label for="gender">Gender <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <span class="error-message" id="gender-error"></span>
                </div>
                
                <!-- Address -->
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3"></textarea>
                    <span class="error-message" id="address-error"></span>
                </div>
                
                <!-- Country -->
                <div class="form-group">
                    <label for="country">Country <span class="required">*</span></label>
                    <select id="country" name="country" required>
                        <option value="">Select Country</option>
                        <option value="USA">United States</option>
                        <option value="India">India</option>
                        <option value="UK">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                    </select>
                    <span class="error-message" id="country-error"></span>
                </div>
                
                <!-- State -->
                <div class="form-group">
                    <label for="state">State <span class="required">*</span></label>
                    <select id="state" name="state" required disabled>
                        <option value="">Select State</option>
                    </select>
                    <span class="error-message" id="state-error"></span>
                </div>
                
                <!-- City -->
                <div class="form-group">
                    <label for="city">City <span class="required">*</span></label>
                    <select id="city" name="city" required disabled>
                        <option value="">Select City</option>
                    </select>
                    <span class="error-message" id="city-error"></span>
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <span class="strength-text" id="strengthText"></span>
                    <span class="error-message" id="password-error"></span>
                </div>
                
                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <span class="error-message" id="confirmPassword-error"></span>
                </div>
                
                <!-- Terms & Conditions -->
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        I agree to the <a href="#" target="_blank">Terms & Conditions</a> <span class="required">*</span>
                    </label>
                    <span class="error-message" id="terms-error"></span>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="submit-btn" disabled>Register</button>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
